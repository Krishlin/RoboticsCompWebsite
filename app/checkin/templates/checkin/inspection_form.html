{# owner: Shivani — pass/fail inspection checklist for one team #}
{% extends "base.html" %}
{% block title %}Inspection{% endblock %}
{% block content %}

<h1 class="page-title">
    Inspection — Team {{ team.team_number }}
</h1>

<p>{{ team.name }}</p>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <p>
        <label>
            <input type="checkbox" name="size_ok">
            Size OK
        </label>
    </p>

    <p>
        <label>
            <input type="checkbox" name="weight_ok">
            Weight OK
        </label>
    </p>

    <p>
        <label>
            <input type="checkbox" name="microbit_present">
            micro:bit present
        </label>
    </p>

    <p>
        <label>
            <input type="checkbox" name="team_number_displayed">
            Team number displayed
        </label>
    </p>

    <p>
        <label>
            <input type="checkbox" name="ref_start_stop_test">
            Ref start/stop test
        </label>
    </p>

    <p>
        <label>
            Inspector:
            <input type="text" name="inspector_name">
        </label>
    </p>

    <p>
        <label>
            Notes:
            <textarea name="notes"></textarea>
        </label>
    </p>

    <button type="submit" class="btn btn-secondary">
        Save Inspection
    </button>

</form>

{% endblock %}
