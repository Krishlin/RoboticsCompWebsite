# Tooling config. The app itself is not packaged; this file exists so ruff and
# pytest behave the same for everyone instead of depending on each person's
# editor settings.

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `from tests.conftest import staff_auth` resolves when pytest is run from
# the project root.
pythonpath = ["."]
filterwarnings = [
    # SQLAlchemy calls datetime.utcnow() internally on 3.13. Our own use is
    # fixed (app/models.py:utcnow) and this stops that being drowned out.
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.ruff]
line-length = 100
exclude = ["venv", "migrations", "__pycache__"]

[tool.ruff.lint]
# E402 is enabled deliberately: several modules import after sys.path setup or
# after a blueprint is defined, and each carries a `# noqa: E402` explaining
# why. Enabling the rule is what makes those comments mean something.
# BLE is enabled for the same reason as E402: app/mail.py deliberately
# catches bare Exception and explains why in a noqa, and the rule has to
# be on for that comment to be checked rather than merely decorative.
select = ["E4", "E7", "E9", "F", "B", "BLE", "UP", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "UP031",   # percent-format in referee/routes.py is fine and deliberate
]
