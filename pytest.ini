# See the header in ruff.toml for why this is not in pyproject.toml.
[pytest]
testpaths = tests
# So `from tests.conftest import staff_auth` resolves when pytest is run from
# the project root.
pythonpath = .
filterwarnings =
    # SQLAlchemy calls datetime.utcnow() internally on 3.13. Our own use is
    # fixed (app/models.py:utcnow) and this stops that being drowned out.
    ignore:datetime.datetime.utcnow:DeprecationWarning
